# Quantumult X 重写模块 · 星驰API 自动签到

[rewrite_local]
# 保存 access_token：登录响应或任意携带 Authorization 的请求
^https?:\/\/(api\.)?xingchiapi\.com\/api\/ url script-response-body https://raw.githubusercontent.com/bravo-1/xingchi-api/main/xingchi_qx_capture.js

# 定时签到示例（在圈X「重写 → 脚本」中添加，不要带 URL 匹配前缀）：
# xingchi_qx_checkin.js cron "5 8 * * *"

# 手动触发签到（可选，打开 https://api.xingchiapi.com/api/v1/lottery）
^https?:\/\/(api\.)?xingchiapi\.com\/api\/v1\/lottery url script-request-body https://raw.githubusercontent.com/你的用户名/你的仓库/main/xingchi_qx_checkin.js

[mitm]
hostname = xingchiapi.com, api.xingchiapi.com
