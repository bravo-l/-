# Quantumult X 重写模块 · 星驰API 自动签到

[rewrite_local]
# 保存 refresh_token（可选）
^https?:\/\/(api\.)?xingchiapi\.com\/api\/v1\/auth\/ url script-response-body https://raw.githubusercontent.com/bravo-l/xingchi-api/main/xingchi_qx_capture.js

# 定时签到示例（在圈X「重写 → 脚本」中添加，不要带 URL 匹配前缀）：
# xingchi_qx_checkin.js cron "5 8 * * *" XINGCHI_REFRESH_TOKEN=rt_你的首次令牌

# 手动触发签到（可选，打开 https://api.xingchiapi.com/api/v1/user/checkin）
^https?:\/\/(api\.)?xingchiapi\.com\/api\/v1\/user\/checkin url script-request-body https://raw.githubusercontent.com/bravo-l/xingchi-api/main/xingchi_qx_checkin.js

[mitm]
hostname = xingchiapi.com, api.xingchiapi.com
